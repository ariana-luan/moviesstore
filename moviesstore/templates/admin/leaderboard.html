{% extends "admin/base_site.html" %}

{% block content %}
<h1>Top Purchasers</h1>

<table>
    <thead>
        <tr><th>User</th><th>Movies Purchased</th></tr>
    </thead>
    <tbody>
    {% for row in stats %}
    <tr>
        <td>{{ row.order__user__username }}</td>
        <td>{{ row.order_movies }}</td>
    </tr>
    {% endfor %}
    </tbody>
</table>
{% endblock %}
